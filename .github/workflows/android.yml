# Gera o APK de teste e o AAB de loja do Bee Water a cada push na main.
# Para assinar o AAB, cadastre os secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD (Settings → Secrets and variables → Actions).
name: Android (APK de teste + AAB de loja)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: VITE_STORE_BUILD=1 npm run build
      - run: npx cap sync android
      - name: APK de teste (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: AAB de loja (release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload.keystore
            ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$PWD/app/upload.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            echo "AAB assinado com a chave de upload."
          else
            ./gradlew bundleRelease --no-daemon
            echo "AAB sem assinatura: cadastre os secrets para assinar."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bee-water-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release*.aab
